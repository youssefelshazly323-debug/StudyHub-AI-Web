<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do — StudyHub AI</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="app-brand" href="home.html" aria-label="StudyHub AI dashboard"><span class="app-logo">◫</span><span>StudyHub AI</span></a>
      <nav class="side-nav">
        <a href="home.html" aria-label="Home"><span class="nav-icon">⌂</span><span>Home</span></a><a href="profile.html" aria-label="About"><span class="nav-icon">ⓘ</span><span>About</span></a>
        <a href="files.html" aria-label="Files"><span class="nav-icon">▢</span><span>Files</span></a><a class="active" href="todo.html" aria-label="To-Do"><span class="nav-icon">☷</span><span>To-Do</span></a>
        <a href="schedule.html" aria-label="Schedule"><span class="nav-icon">▦</span><span>Schedule</span></a><a href="chat.html" aria-label="Chat"><span class="nav-icon">◌</span><span>Chat</span></a>
        <a href="../contact.html" aria-label="Contact"><span class="nav-icon">▣</span><span>Contact</span></a>
      </nav>
      <a class="account-chip" href="profile.html" aria-label="Naledi Mokoena settings"><img class="avatar" src="../assets/images/naledi-avatar.png" alt="" /><span>Naledi Mokoena<small>Student plan · Settings</small></span></a>
    </aside>
    <main class="app-main">
      <header class="page-head"><div><h1>To-Do</h1><p>5 demo tasks · 2 due today</p></div><button class="primary" type="button" disabled title="Task creation is not connected in this demo">Add task</button></header>
      <section class="dashboard-grid" style="grid-template-columns:minmax(0,2.4fr) minmax(190px,.8fr)">
        <article class="panel"><h2>75% complete this week</h2><div class="progress-line" style="height:8px"><span style="width:65%"></span></div></article>
        <article class="panel"><p>Focus suggestion</p><h2>Start the essay outline next</h2></article>
      </section>
      <div class="tabs">
        <button class="selected" type="button" data-filter="all" data-label="All" aria-pressed="true">All 5</button><button type="button" data-filter="today" data-label="Today" aria-pressed="false">Today 2</button><button type="button" data-filter="upcoming" data-label="Upcoming" aria-pressed="false">Upcoming 2</button><button type="button" data-filter="completed" data-label="Completed" aria-pressed="false">Completed 1</button>
      </div>
      <p class="muted" id="todo-filter-status" role="status" aria-live="polite"></p>
      <section class="panel" style="min-height:526px">
        <label class="todo-row" data-due="today" data-state="open"><input type="checkbox" /><span><strong>Submit Economics essay outline</strong><small><span class="tag">Economics 201</span> &nbsp; Today · 16:00</small></span><span class="tag">High</span><span class="purple">•••</span></label>
        <label class="todo-row" data-due="today" data-state="open"><input type="checkbox" /><span><strong>Revise cell respiration diagrams</strong><small><span class="tag">Biology 201</span> &nbsp; Today · 19:30</small></span><span class="tag">Medium</span><span class="purple">•••</span></label>
        <label class="todo-row" data-due="upcoming" data-state="open"><input type="checkbox" /><span><strong>Complete probability tutorial 4</strong><small><span class="tag">Statistics 101</span> &nbsp; Tomorrow · 18:00</small></span><span class="tag">High</span><span class="purple">•••</span></label>
        <label class="todo-row" data-due="upcoming" data-state="open"><input type="checkbox" /><span><strong>Read chapter 6: Labour markets</strong><small><span class="tag">Economics 201</span> &nbsp; Mon · 10:00</small></span><span class="tag">Low</span><span class="purple">•••</span></label>
        <label class="todo-row done" data-due="upcoming" data-state="completed"><input type="checkbox" checked /><span><strong>Upload BIO201 lab notes</strong><small><span class="tag">Biology 201</span> &nbsp; Yesterday · 15:00</small></span><span class="tag">Done</span><span class="purple">•••</span></label>
      </section>
    </main>
    <script>
      const todoRows = Array.from(document.querySelectorAll(".todo-row"));
      const filterStatus = document.getElementById("todo-filter-status");

      function updateTodoCounts() {
        const counts = {
          all: todoRows.length,
          today: todoRows.filter(
            (row) => row.dataset.due === "today" && row.dataset.state === "open",
          ).length,
          upcoming: todoRows.filter(
            (row) =>
              row.dataset.due === "upcoming" && row.dataset.state === "open",
          ).length,
          completed: todoRows.filter((row) => row.dataset.state === "completed")
            .length,
        };
        document.querySelectorAll(".tabs button").forEach((tab) => {
          tab.textContent = `${tab.dataset.label} ${counts[tab.dataset.filter]}`;
        });
      }

      function applyTodoFilter(filter) {
        let visibleCount = 0;
        for (const row of todoRows) {
          const matches =
            filter === "all" ||
            (filter === "completed" && row.dataset.state === "completed") ||
            (filter === row.dataset.due && row.dataset.state === "open");
          row.hidden = !matches;
          if (matches) visibleCount += 1;
        }
        filterStatus.textContent = `Showing ${visibleCount} ${visibleCount === 1 ? "task" : "tasks"}.`;
        updateTodoCounts();
      }

      document.querySelectorAll(".tabs button").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tabs button").forEach((item) => {
            item.classList.remove("selected");
            item.setAttribute("aria-pressed", "false");
          });
          tab.classList.add("selected");
          tab.setAttribute("aria-pressed", "true");
          applyTodoFilter(tab.dataset.filter);
        });
      });

      for (const row of todoRows) {
        row.querySelector("input").addEventListener("change", (event) => {
          row.classList.toggle("done", event.target.checked);
          row.dataset.state = event.target.checked ? "completed" : "open";
          updateTodoCounts();
          const selectedFilter = document.querySelector(".tabs .selected");
          if (selectedFilter) applyTodoFilter(selectedFilter.dataset.filter);
        });
      }
      applyTodoFilter("all");
    </script>
  </body>
</html>
