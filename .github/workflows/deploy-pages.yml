name: Deploy StudyHub AI website

on:
  push:
    branches:
      - main
    paths:
      - "my-website/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p public
          cp my-website/*.html public/
          cp my-website/*.css public/
          cp my-website/*.js public/
          if [ -d my-website/assets ]; then
            cp -r my-website/assets public/
          fi
          test -f public/index.html
          ls -la public

      - name: Verify website output
        run: |
          echo "Checking website files..."
          ls -la my-website/dist
          test -f my-website/dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
