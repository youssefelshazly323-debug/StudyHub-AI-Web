name: Deploy StudyHub AI website

on:
  push:
    branches:
      - main
    paths:
      - "my-website/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          set -e

          mkdir -p public
          mkdir -p public/app

          # Copy main website files
          cp my-website/*.html public/
          cp my-website/*.css public/
          cp my-website/*.js public/

          # Copy assets
          if [ -d my-website/assets ]; then
            cp -r my-website/assets public/
          fi

          # Copy app files while keeping the /app folder
          if [ -d my-website/app ]; then
            cp my-website/app/*.html public/app/
            cp my-website/app/*.css public/app/ 2>/dev/null || true
            cp my-website/app/*.js public/app/ 2>/dev/null || true
          fi

          echo "Published files:"
          find public -maxdepth 2 -type f | sort

          test -f public/index.html
          test -f public/app/home.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
